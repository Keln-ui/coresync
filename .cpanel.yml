---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$(whoami)/coresync
    - /bin/cp -r . $DEPLOYPATH
    - source /home/$(whoami)/virtualenv/coresync/3.11/bin/activate && cd $DEPLOYPATH && pip install -r requirements.txt --quiet
    - source /home/$(whoami)/virtualenv/coresync/3.11/bin/activate && cd $DEPLOYPATH && python manage.py migrate --noinput
    - source /home/$(whoami)/virtualenv/coresync/3.11/bin/activate && cd $DEPLOYPATH && python manage.py collectstatic --noinput
